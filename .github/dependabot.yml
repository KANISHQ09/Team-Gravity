# Dependabot opens pull requests for dependency updates. They are never
# merged automatically: a team member reviews and merges each one.
version: 2
updates:
  # npm ecosystem also covers pnpm workspaces (reads pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (see docs/TECH_STACK.md §4).
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Node type definitions must match the Node.js runtime major (22, see .nvmrc).
      # Bump together with .nvmrc and package.json "engines" when moving Node versions.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
